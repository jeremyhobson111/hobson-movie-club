name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required project files exist
        run: |
          for f in CLAUDE.md docs/PROJECT.md docs/STATE.md docs/DECISIONS.md CHANGELOG.md .env.example; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: No env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "An env file is tracked by git"; exit 1
          fi

