name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required project files exist
        run: |
          for f in CLAUDE.md docs/PROJECT.md docs/STATE.md docs/DECISIONS.md CHANGELOG.md .env.example; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: No env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "An env file is tracked by git"; exit 1
          fi

  # The site has no build step and no npm packages: these run the project's own tests with plain Node.
  # Node 22 can run the Supabase function code (TypeScript) directly for the two function checks.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (survey, results, members, push, admin helpers)
        run: node --test tests/*.test.mjs
      - name: Plex webhook receiver checks
        run: node --experimental-strip-types --no-warnings tests/plex-webhook.check.mjs
      - name: Send-push function checks
        run: node --experimental-strip-types --no-warnings tests/send-push.check.mjs
